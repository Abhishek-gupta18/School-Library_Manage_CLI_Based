{% extends "base.html" %}

{% block title %}Marks Entry - School Management System{% endblock %}

{% block content %}
<h2 style="color: #495057; margin-bottom: 30px;">Student Marks Entry</h2>

<form method="POST">
    <div class="grid">
        <div class="form-group">
            <label for="rname">Student Name</label>
            <input type="text" id="rname" name="rname" required>
        </div>
        
        <div class="form-group">
            <label for="radm_no">Admission Number</label>
            <input type="number" id="radm_no" name="radm_no" required>
        </div>
    </div>
    
    <div class="grid">
        <div class="form-group">
            <label for="roll_no">Roll Number</label>
            <input type="number" id="roll_no" name="roll_no" required>
        </div>
        
        <div class="form-group">
            <label for="rmob">Registered Mobile Number</label>
            <input type="tel" id="rmob" name="rmob" pattern="[0-9]{10}" required>
        </div>
    </div>
    
    <h3 style="color: #495057; margin: 30px 0 20px 0;">Subject Marks (Out of 100)</h3>
    
    <div class="grid">
        <div class="form-group">
            <label for="english">English</label>
            <input type="number" id="english" name="english" min="0" max="100" required>
        </div>
        
        <div class="form-group">
            <label for="hindi">Hindi</label>
            <input type="number" id="hindi" name="hindi" min="0" max="100" required>
        </div>
    </div>
    
    <div class="grid">
        <div class="form-group">
            <label for="math">Mathematics</label>
            <input type="number" id="math" name="math" min="0" max="100" required>
        </div>
        
        <div class="form-group">
            <label for="social_science">Social Science</label>
            <input type="number" id="social_science" name="social_science" min="0" max="100" required>
        </div>
    </div>
    
    <div class="form-group">
        <label for="science">Science</label>
        <input type="number" id="science" name="science" min="0" max="100" required>
    </div>
    
    <div style="text-align: center; margin-top: 30px;">
        <button type="submit" class="btn">Save Marks</button>
        <a href="{{ url_for('index') }}" class="btn btn-secondary" style="margin-left: 10px;">Back to Home</a>
    </div>
</form>
{% endblock %}
