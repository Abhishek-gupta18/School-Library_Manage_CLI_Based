{% extends "base.html" %}

{% block title %}Suggestions - School Management System{% endblock %}

{% block content %}
<h2 style="color: #495057; margin-bottom: 30px;">Submit Your Suggestion</h2>

<form method="POST">
    <div class="grid">
        <div class="form-group">
            <label for="sname">Ward's Name</label>
            <input type="text" id="sname" name="sname" required>
        </div>
        
        <div class="form-group">
            <label for="sclass">Ward's Class</label>
            <input type="number" id="sclass" name="sclass" min="1" max="12" required>
        </div>
    </div>
    
    <div class="form-group">
        <label for="suggestion">Your Suggestion</label>
        <textarea id="suggestion" name="suggestion" rows="6" placeholder="Please share your valuable suggestions for school improvement..." required></textarea>
    </div>
    
    <div style="text-align: center; margin-top: 30px;">
        <button type="submit" class="btn">Submit Suggestion</button>
        <a href="{{ url_for('index') }}" class="btn btn-secondary" style="margin-left: 10px;">Back to Home</a>
    </div>
</form>
{% endblock %}
