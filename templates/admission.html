{% extends "base.html" %}

{% block title %}Admission - School Management System{% endblock %}

{% block content %}
<h2 style="color: #495057; margin-bottom: 30px;">Student Admission Form</h2>

<form method="POST">
    <div class="grid">
        <div class="form-group">
            <label for="aname">Student Name</label>
            <input type="text" id="aname" name="aname" required>
        </div>
        
        <div class="form-group">
            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" name="dob" required>
        </div>
    </div>
    
    <div class="form-group">
        <label for="address">Permanent Address</label>
        <textarea id="address" name="address" rows="3" required></textarea>
    </div>
    
    <div class="grid">
        <div class="form-group">
            <label for="fname">Father's Name</label>
            <input type="text" id="fname" name="fname" required>
        </div>
        
        <div class="form-group">
            <label for="mname">Mother's Name</label>
            <input type="text" id="mname" name="mname" required>
        </div>
    </div>
    
    <div class="grid">
        <div class="form-group">
            <label for="sex">Gender</label>
            <select id="sex" name="sex" required>
                <option value="">Select Gender</option>
                <option value="M">Male</option>
                <option value="F">Female</option>
                <option value="O">Others</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="mnum">Guardian's Mobile Number</label>
            <input type="tel" id="mnum" name="mnum" pattern="[0-9]{10}" placeholder="10-digit mobile number" required>
        </div>
    </div>
    
    <div class="grid">
        <div class="form-group">
            <label for="blood_group">Blood Group</label>
            <select id="blood_group" name="blood_group" required>
                <option value="">Select Blood Group</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="classes">Class to Enroll</label>
            <select id="classes" name="classes" required>
                <option value="">Select Class</option>
                <option value="1">Class 1</option>
                <option value="2">Class 2</option>
                <option value="3">Class 3</option>
                <option value="4">Class 4</option>
                <option value="5">Class 5</option>
                <option value="6">Class 6</option>
                <option value="7">Class 7</option>
                <option value="8">Class 8</option>
                <option value="9">Class 9</option>
                <option value="10">Class 10</option>
                <option value="11">Class 11</option>
                <option value="12">Class 12</option>
            </select>
        </div>
    </div>
    
    <div class="grid">
        <div class="form-group">
            <label for="caste">Category</label>
            <select id="caste" name="caste" required>
                <option value="">Select Category</option>
                <option value="1">General</option>
                <option value="2">SC</option>
                <option value="3">ST</option>
                <option value="4">OBC</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="occupation">Parent's Occupation</label>
            <input type="text" id="occupation" name="occupation" required>
        </div>
    </div>
    
    <div style="text-align: center; margin-top: 30px;">
        <button type="submit" class="btn">Submit Admission Form</button>
        <a href="{{ url_for('index') }}" class="btn btn-secondary" style="margin-left: 10px;">Back to Home</a>
    </div>
</form>
{% endblock %}
