{% extends "base.html" %}

{% block title %}Transfer Certificate - School Management System{% endblock %}

{% block content %}
<h2 style="color: #495057; margin-bottom: 30px;">Transfer Certificate Application</h2>

<form method="POST">
    <div class="form-group">
        <label for="tname">Student Name</label>
        <input type="text" id="tname" name="tname" required>
    </div>
    
    <div class="form-group">
        <label for="tadm_no">Admission Number</label>
        <input type="number" id="tadm_no" name="tadm_no" required>
    </div>
    
    <div class="form-group">
        <label for="reason">Reason for Transfer</label>
        <textarea id="reason" name="reason" rows="4" required></textarea>
    </div>
    
    <div style="text-align: center; margin-top: 30px;">
        <button type="submit" class="btn">Submit TC Application</button>
        <a href="{{ url_for('index') }}" class="btn btn-secondary" style="margin-left: 10px;">Back to Home</a>
    </div>
</form>
{% endblock %}
